<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - RangRasiya Admin</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --sidebar-bg: #ffffff;
            --main-bg: #f8f9fa;
            --border-color: #dee2e6;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --brand-primary: #C70039;
            --brand-primary-light: #fbebee;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--main-bg);
            color: var(--text-primary);
        }

        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: -260px; /* Hidden by default on mobile */
            height: 100%;
            z-index: 1030;
            transition: left 0.3s ease;
        }
        
        .sidebar.active {
            left: 0;
        }

        .sidebar-header {
            border: 2px dashed var(--border-color);
            padding: 1rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .sidebar-header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
            color: var(--brand-primary);
        }

        .sidebar-nav .nav-link {
            color: var(--text-secondary);
            font-weight: 500;
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
        }
        .sidebar-nav .nav-link .nav-icon {
            margin-right: 0.75rem;
            font-size: 1.1rem;
        }

        .sidebar-nav .nav-link:hover {
            background-color: var(--brand-primary-light);
            color: var(--brand-primary);
        }

        .sidebar-nav .nav-link.active {
            background-color: var(--brand-primary-light);
            color: var(--brand-primary);
            font-weight: 600;
        }
        
        .sidebar-footer {
            margin-top: auto;
        }

        /* --- Main Content --- */
        .main-content {
            flex-grow: 1;
            padding: 1.5rem;
            transition: margin-left 0.3s ease;
            width: 100%;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .main-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .admin-profile .avatar {
            width: 40px;
            height: 40px;
            background-color: #ced4da;
            border-radius: 50%;
        }
        
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1020;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* --- Responsive Styles --- */
        @media (min-width: 992px) {
            .sidebar {
                left: 0; /* Always visible on large screens */
            }
            .main-content {
                margin-left: 260px;
            }
            .sidebar-toggle {
                display: none; /* Hide hamburger on large screens */
            }
        }
        
        /* Stat cards and tables from previous design remain largely the same */
        .stat-card { background-color: #ffffff; border: 1px solid var(--border-color); border-radius: 0.5rem; padding: 1.5rem; text-align: center; box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.05); }
        .stat-card .number { font-size: 2rem; font-weight: 700; color: var(--text-primary); }
        .stat-card .label { font-size: 0.9rem; color: var(--text-secondary); margin-top: 0.25rem; }
        .data-table-container { background-color: #ffffff; border: 1px solid var(--border-color); min-height: 300px; color: var(--text-secondary); border-radius: 0.5rem; padding: 1.5rem; box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.05); }
        .data-table-container h3 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; color: var(--text-primary); }
        .data-table-placeholder { border: 2px dashed var(--border-color); min-height: 250px; display: flex; align-items: center; justify-content: center; border-radius: 0.375rem;}

    </style>
</head>
<body>
    <div class="sidebar-overlay"></div>
    <div class="admin-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Admin Panel</h1>
            </div>
            <nav class="sidebar-nav">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" href="dashboard.html">
                            <i class="bi bi-grid-1x2-fill nav-icon"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="inventory.html">
                            <i class="bi bi-box-seam-fill nav-icon"></i> Inventory
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="bookings.html">
                            <i class="bi bi-calendar-check-fill nav-icon"></i> Bookings
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="customers.html">
                            <i class="bi bi-people-fill nav-icon"></i> Customers
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reports.html">
                            <i class="bi bi-bar-chart-line-fill nav-icon"></i> Reports
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                 <a class="nav-link" href="../index.html">
                    <i class="bi bi-box-arrow-left nav-icon"></i> Logout
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <div class="d-flex align-items-center">
                    <button class="btn btn-light me-3 sidebar-toggle d-lg-none">
                        <i class="bi bi-list"></i>
                    </button>
                    <h2>Dashboard</h2>
                </div>
                <div class="admin-profile d-none d-sm-flex">
                    <span>Admin Name</span>
                    <div class="avatar"></div>
                </div>
            </header>

            <!-- Statistics Cards -->
            <div class="row g-4">
                <div class="col-md-6 col-xl-3">
                    <div class="stat-card">
                        <div class="number">128</div>
                        <div class="label">Total Outfits</div>
                    </div>
                </div>
                <div class="col-md-6 col-xl-3">
                    <div class="stat-card">
                        <div class="number">42</div>
                        <div class="label">Outfits Booked</div>
                    </div>
                </div>
                <div class="col-md-6 col-xl-3">
                    <div class="stat-card">
                        <div class="number">8</div>
                        <div class="label">Pending Requests</div>
                    </div>
                </div>
                <div class="col-md-6 col-xl-3">
                    <div class="stat-card">
                        <div class="number">₹84,500</div>
                        <div class="label">Total Revenue</div>
                    </div>
                </div>
            </div>

            <!-- Recent Booking Requests -->
            <section class="mt-4 data-table-container">
                <h3>Recent Booking Requests</h3>
                <div class="data-table-placeholder">
                    [Data Table Placeholder]
                </div>
            </section>

        </main>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.querySelector('.sidebar');
            const sidebarToggle = document.querySelector('.sidebar-toggle');
            const sidebarOverlay = document.querySelector('.sidebar-overlay');

            function toggleSidebar() {
                sidebar.classList.toggle('active');
                sidebarOverlay.classList.toggle('active');
            }

            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', toggleSidebar);
            }
            
            if (sidebarOverlay) {
                sidebarOverlay.addEventListener('click', toggleSidebar);
            }
        });
    </script>

</body>
</html>
