<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - RangRasiya Rentals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- <link rel="stylesheet" href="../css/custom.css"> -->

    <style>
        .admin-bg {
            background-color: #f8f9fa;
        }
        .logo {
             font-family: 'Playfair Display', serif;
             font-weight: 700;
             color: #C70039; /* Festive Red */
        }
        
        .invalid-feedback {
            min-height: 1.25rem; 
        }
        .btn-primary:disabled {
            background-color: #6c757d;
            border-color: #6c757d;
        }
    </style>
</head>
<body class="admin-bg">
    <div class="container">
        <div class="row min-vh-100 justify-content-center align-items-center">
            <div class="col-lg-4 col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h1 class="logo h2">Admin Panel</h1>
                            <h5 class="card-title mt-2 text-muted">Administrator Login</h5>
                        </div>
                        
                        <form id="admin-login-form" novalidate>
                            <div class="mb-3">
                                <label for="username" class="form-label">Username or Email</label>
                                <input type="text" class="form-control" id="username" required>
                                <div id="username-error" class="invalid-feedback"></div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                                <div id="password-error" class="invalid-feedback"></div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Login Securely</button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <a href="#" class="text-decoration-none">Forgot Password?</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- --- UPDATED VALIDATION SCRIPT --- -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('admin-login-form');
            const usernameInput = document.getElementById('username'); 
            const passwordInput = document.getElementById('password');
            const usernameError = document.getElementById('username-error'); 
            const passwordError = document.getElementById('password-error');
            const submitButton = loginForm.querySelector('button[type="submit"]');

            // --- Helper Functions (Adapted for Bootstrap) ---
            function showError(input, errorElement, message) {
                input.classList.add('is-invalid'); 
                errorElement.innerHTML = message;
            }

            function clearError(input, errorElement) {
                input.classList.remove('is-invalid'); 
                errorElement.innerHTML = '';
            }

            // --- UPDATED USERNAME/EMAIL VALIDATION ---
            function validateUsername() {
                const usernameValue = usernameInput.value.trim();
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; // Standard email regex

                if (usernameValue === '') {
                    showError(usernameInput, usernameError, 'Username or Email is required.');
                    return false;
                }

                // Check if user is trying to type an email
                if (usernameValue.includes('@')) {
                    if (!emailRegex.test(usernameValue)) {
                        showError(usernameInput, usernameError, 'Please enter a valid email address.');
                        return false;
                    }
                } 
                // Check if it's a username (and not an email)
                else { 
                    if (usernameValue.length < 3) { // Simple username rule
                        showError(usernameInput, usernameError, 'Username must be at least 3 characters.');
                        return false;
                    }
                }

                // If it passes all checks
                clearError(usernameInput, usernameError);
                return true;
            }

            // --- Advanced Password Validation (from your script) ---
            function validatePassword() {
                const passwordValue = passwordInput.value;
                let errors = [];

                const lowerRegex = /[a-z]/;
                const upperRegex = /[A-Z]/;
                const symbolRegex = /[!@#$%^&*(),.?":{}|<>]/;
                const digitRegex = /[0-9]/; 

                if (passwordValue.length < 8) {
                    errors.push('At least 8 characters long.');
                }
                if (!lowerRegex.test(passwordValue)) {
                    errors.push('At least one lowercase letter (a-z).');
                }
                if (!upperRegex.test(passwordValue)) {
                    errors.push('At least one uppercase letter (A-Z).');
                }
                if (!digitRegex.test(passwordValue)) {
                    errors.push('At least one digit (0-9).');
                }
                if (!symbolRegex.test(passwordValue)) {
                    errors.push('At least one symbol (e.g., !@#$).');
                }

                if (errors.length > 0) {
                    let errorHTML = '<ul class="list-unstyled mb-0" style="font-size: 0.875rem;">';
                    errors.forEach(error => {
                        errorHTML += `<li>&bull; ${error}</li>`;
                    });
                    errorHTML += '</ul>';
                    
                    showError(passwordInput, passwordError, errorHTML);
                    return false;
                } else {
                    clearError(passwordInput, passwordError);
                    return true;
                }
            }

            // --- Live Validation (on input) ---
            usernameInput.addEventListener('input', validateUsername);
            passwordInput.addEventListener('input', validatePassword);

            // --- Form Submit Validation ---
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault(); // Stop the form from submitting

                const isUsernameValid = validateUsername();
                const isPasswordValid = validatePassword();

                if (isUsernameValid && isPasswordValid) {
                    // --- SUCCESS ---
                    console.log('Admin login successful');
                    submitButton.textContent = 'Logging in...';
                    submitButton.disabled = true;

                    // Redirect to the dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    // --- FAILURE ---
                    console.log('Admin login failed validation');
                }
            });
        });
    </script>
</body>
</html>
